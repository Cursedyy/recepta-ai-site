<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Painel · Recepta AI</title>
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/img/favicon-512.png"
    />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fafafd;
        --surface: #ffffff;
        --ink: #100d22;
        --muted: #302e47;
        --line: #e7e5f2;
        --accent: #26205c;
        --accent-ink: #ffffff;
        --accent-soft: #f3f2f5;
        --accent-2: #afa8eb;
        --header-bg: #151749;
        --radius: 14px;
        --ghost: #eceafa;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }

      /* gate */
      #gate {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #gate form {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 32px 28px;
        max-width: 340px;
        width: 100%;
        box-shadow: 0 20px 50px -30px rgba(20, 30, 27, 0.35);
      }
      #gate h1 {
        font-size: 19px;
        margin-bottom: 6px;
      }
      #gate p {
        color: var(--muted);
        font-size: 13.5px;
        margin-bottom: 18px;
      }
      #gate input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 12px;
      }
      #gate input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #gate button {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.12s;
      }
      #gate button:hover {
        filter: brightness(1.08);
      }
      #gate .erro {
        color: #b3261e;
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 16px;
      }

      /* app */
      #app {
        display: none;
        height: 100vh;
        flex-direction: column;
      }
      #app.show {
        display: flex;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        background: linear-gradient(90deg, var(--header-bg) 0%, #241f63 58%, #332a80 100%);
        color: #fff;
        flex: 0 0 auto;
      }
      .topbar-left {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .topbar-left b {
        font-size: 15px;
      }
      .topbar-sub {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.6);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 0 0 auto;
      }
      .conexao {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.7);
      }
      .conexao .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2e9e5b;
      }
      .conexao.erro .dot {
        background: #d97706;
        animation: pulse 1.2s infinite;
      }
      .topbar button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      .topbar button:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .layout {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
        position: relative;
      }

      /* lista */
      #lista-col {
        width: 340px;
        flex: 0 0 340px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        min-height: 0;
      }
      #busca-wrap {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      #busca {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--bg);
      }
      #busca:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #lista {
        flex: 1 1 auto;
        overflow-y: auto;
      }
      #lista .vazio {
        padding: 20px 16px;
        color: var(--muted);
        font-size: 13.5px;
      }

      .grupo-clinica {
        border-bottom: 1px solid var(--line);
      }
      .grupo-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 10px 16px;
        background: var(--accent-soft);
        border: none;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        text-align: left;
      }
      .grupo-header .nome {
        font-weight: 700;
        font-size: 12.5px;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .grupo-header .contagem {
        font-weight: 600;
        color: var(--muted);
        font-size: 11px;
        background: rgba(16, 13, 34, 0.08);
        padding: 1px 7px;
        border-radius: 99px;
        flex: 0 0 auto;
      }
      .grupo-header .seta {
        margin-left: auto;
        font-size: 10px;
        color: var(--muted);
        transition: transform 0.15s;
        flex: 0 0 auto;
      }
      .grupo-header.colapsado .seta {
        transform: rotate(-90deg);
      }
      .grupo-pacientes.colapsado {
        display: none;
      }

      .paciente-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 16px 12px 22px;
        border: none;
        border-bottom: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
        transition: background 0.15s;
      }
      .paciente-item:hover {
        background: var(--ghost);
      }
      .paciente-item.ativo {
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
      }
      .paciente-item .linha1 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .paciente-item .tel {
        font-weight: 700;
        font-size: 13.5px;
      }
      .paciente-item .rel {
        color: var(--muted);
        font-size: 11px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .paciente-item .prev {
        color: var(--muted);
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 3px;
      }

      /* conversa */
      #painel-conversa {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #f1f0f9;
      }
      #conversa-head {
        padding: 11px 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }
      #conversa-head .voltar {
        display: none;
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--ink);
      }
      #conversa-head .info b {
        display: block;
        font-size: 14px;
      }
      #conversa-head .info .sub {
        font-size: 11.5px;
        color: var(--muted);
      }
      #conversa-head .info {
        flex: 1;
        min-width: 0;
      }
      .btn-pausar {
        flex: 0 0 auto;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn-pausar:hover {
        background: var(--accent-soft);
      }
      .btn-pausar.pausada {
        background: #fef3cd;
        border-color: #f59e0b;
        color: #92400e;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      #msgs {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      #msgs .placeholder {
        margin: auto;
        color: var(--muted);
        font-size: 13.5px;
        text-align: center;
        max-width: 220px;
      }
      .dia-sep {
        align-self: center;
        background: rgba(16, 13, 34, 0.06);
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 99px;
        margin: 8px 0;
      }
      .bub {
        max-width: 58%;
        padding: 7px 11px;
        border-radius: 14px;
        font-size: 13.5px;
        line-height: 1.4;
        word-break: break-word;
      }
      .bub .tm {
        display: block;
        font-size: 9.5px;
        color: var(--muted);
        margin-top: 2px;
        text-align: right;
      }
      .bub.in {
        align-self: flex-start;
        background: #fff;
        border-bottom-left-radius: 4px;
      }
      .bub.out {
        align-self: flex-end;
        background: #d6cff2;
        border-bottom-right-radius: 4px;
      }
      .chip-midia {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(16, 13, 34, 0.06);
        padding: 4px 9px;
        border-radius: 8px;
        font-size: 12.5px;
      }

      @media (max-width: 760px) {
        #lista-col {
          position: absolute;
          inset: 0;
          width: 100%;
          z-index: 2;
        }
        #app.conversa-aberta #lista-col {
          display: none;
        }
        #painel-conversa {
          position: absolute;
          inset: 0;
          width: 100%;
        }
        #app:not(.conversa-aberta) #painel-conversa {
          display: none;
        }
        #conversa-head .voltar {
          display: block;
        }
        .bub {
          max-width: 80%;
        }
      }
    </style>
  </head>
  <body>
    <main>
    <div id="gate">
      <form id="form-login">
        <h1>Painel Recepta AI</h1>
        <p>Acesso restrito. Entre com seu e-mail e senha.</p>
        <div class="erro" id="login-erro"></div>
        <input
          type="email"
          id="email"
          placeholder="E-mail"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="senha"
          placeholder="Senha"
          autocomplete="current-password"
          required
        />
        <button type="submit">Entrar</button>
      </form>
    </div>

    <div id="app">
      <div class="topbar">
        <div class="topbar-left">
          <b>Painel Recepta AI</b>
          <span class="topbar-sub" id="topbar-sub"></span>
        </div>
        <div class="topbar-right">
          <span class="conexao" id="conexao"
            ><span class="dot"></span
            ><span id="conexao-label">conectando…</span></span
          >
          <button id="btn-exportar" type="button" title="Exportar conversas em CSV">📥 CSV</button>
          <button id="btn-logout" type="button">Sair</button>
        </div>
      </div>
      <div class="layout">
        <div id="lista-col">
          <div id="busca-wrap">
            <input
              type="search"
              id="busca"
              placeholder="Buscar clínica ou telefone"
            />
          </div>
          <div id="lista"></div>
        </div>
        <div id="painel-conversa">
          <div id="conversa-head" style="display: none">
            <button
              class="voltar"
              id="btn-voltar"
              type="button"
              aria-label="Voltar"
            >
              ←
            </button>
            <div class="info">
              <b id="conversa-tel"></b>
              <div class="sub" id="conversa-clinica"></div>
            </div>
            <button type="button" id="btn-pausar-ia" class="btn-pausar" style="display:none">Pausar IA</button>
          </div>
          <div id="msgs">
            <div class="placeholder">
              Selecione uma conversa pra visualizar as mensagens.
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      var elGate = document.getElementById("gate");
      var elApp = document.getElementById("app");
      var elLista = document.getElementById("lista");
      var elBusca = document.getElementById("busca");
      var elMsgs = document.getElementById("msgs");
      var elHead = document.getElementById("conversa-head");
      var elConversaTel = document.getElementById("conversa-tel");
      var elConversaClinica = document.getElementById("conversa-clinica");
      var elLoginErro = document.getElementById("login-erro");
      var elConexao = document.getElementById("conexao");
      var elConexaoLabel = document.getElementById("conexao-label");
      var elTopbarSub = document.getElementById("topbar-sub");

      var supabase = null;
      var pollTimer = null;
      var atual = null; // { telefone, clinica }
      var ultimoCriadoEm = null;
      var ultimaChaveDia = null;
      var clinicasCache = [];
      var colapsados = {};
      var listaEmVoo = false;
      var conversaEmVoo = false;
      var meuPapel = null;
      var iaPausada = false;

      function fmtHora(iso) {
        try {
          return new Date(iso).toLocaleString("pt-BR", {
            timeZone: "America/Sao_Paulo",
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return "";
        }
      }

      function tempoRelativo(iso) {
        var diffMs = Date.now() - new Date(iso).getTime();
        var diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return "agora";
        if (diffMin < 60) return "há " + diffMin + " min";
        var diffH = Math.floor(diffMin / 60);
        if (diffH < 24) return "há " + diffH + "h";
        var diffD = Math.floor(diffH / 24);
        if (diffD === 1) return "ontem";
        if (diffD < 7) return "há " + diffD + "d";
        return fmtHora(iso);
      }

      function chaveDia(iso) {
        try {
          return new Date(iso).toLocaleDateString("en-CA", {
            timeZone: "America/Sao_Paulo",
          });
        } catch (e) {
          return iso;
        }
      }

      function labelDia(iso) {
        var chave = chaveDia(iso);
        var hojeChave = chaveDia(new Date().toISOString());
        if (chave === hojeChave) return "Hoje";
        var ontemChave = chaveDia(
          new Date(Date.now() - 86400000).toISOString(),
        );
        if (chave === ontemChave) return "Ontem";
        try {
          return new Date(iso).toLocaleDateString("pt-BR", {
            timeZone: "America/Sao_Paulo",
          });
        } catch (e) {
          return chave;
        }
      }

      function formatarTelefone(raw) {
        var d = String(raw || "").replace(/\D/g, "");
        if ((d.length === 12 || d.length === 13) && d.indexOf("55") === 0) {
          d = d.slice(2);
        }
        if (d.length === 10 || d.length === 11) {
          var area = d.slice(0, 2);
          var local = d.slice(2);
          if (local.length === 8) local = "9" + local;
          if (local.length === 9) {
            return "(" + area + ") " + local.slice(0, 5) + "-" + local.slice(5);
          }
        }
        return raw;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatarTexto(str) {
        var seguro = escapeHtml(str);
        seguro = seguro.replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>");
        seguro = seguro.replace(/\*([^\n*]+?)\*/g, "<em>$1</em>");
        seguro = seguro.replace(/\n/g, "<br>");
        return seguro;
      }

      function detectarMidia(texto) {
        var obj;
        try {
          obj = JSON.parse(texto);
        } catch (e) {
          return null;
        }
        if (!obj || typeof obj !== "object") return null;

        var mimetype = obj.mimetype || obj.mimeType;
        var url = obj.URL || obj.url;
        var mediaKey = obj.mediaKey || obj.mediaKeyBase64;
        if (!mimetype || !url || !mediaKey) return null;

        var seg = obj.seconds || obj.duration || obj.durationSeconds;
        var souSticker =
          obj.isSticker === true ||
          obj.sticker === true ||
          String(mimetype) === "image/webp";

        if (String(mimetype).indexOf("audio") === 0) {
          return {
            icone: "🎤",
            label: "Áudio" + (seg ? " · " + Math.round(seg) + "s" : ""),
          };
        }
        if (souSticker) {
          return { icone: "🏷", label: "Sticker" };
        }
        if (String(mimetype).indexOf("image") === 0) {
          return { icone: "🖼", label: "Imagem" };
        }
        return { icone: "📎", label: "Documento" };
      }

      function previewTexto(item) {
        var midia = detectarMidia(item.ultima_mensagem || "");
        var corpo = midia
          ? midia.icone + " " + midia.label
          : item.ultima_mensagem || "";
        return (item.ultimo_role === "ia" ? "Recepta: " : "") + corpo;
      }

      function inserirSeparadorSeNecessario(iso) {
        var chave = chaveDia(iso);
        if (chave === ultimaChaveDia) return;
        ultimaChaveDia = chave;
        var sep = document.createElement("div");
        sep.className = "dia-sep";
        sep.textContent = labelDia(iso);
        elMsgs.appendChild(sep);
      }

      function criarBolha(msg) {
        var div = document.createElement("div");
        div.className = "bub " + (msg.role === "ia" ? "out" : "in");

        var midia = detectarMidia(msg.mensagem || "");
        if (midia) {
          var chip = document.createElement("span");
          chip.className = "chip-midia";
          chip.textContent = midia.icone + " " + midia.label;
          div.appendChild(chip);
        } else {
          var corpo = document.createElement("span");
          corpo.innerHTML = formatarTexto(msg.mensagem || "");
          div.appendChild(corpo);
        }

        var tm = document.createElement("span");
        tm.className = "tm";
        tm.textContent = fmtHora(msg.criado_em);
        div.appendChild(tm);
        return div;
      }

      function adicionarMensagem(msg) {
        inserirSeparadorSeNecessario(msg.criado_em);
        elMsgs.appendChild(criarBolha(msg));
      }

      var canalRealtime = null;

      function pararPoll() {
        if (canalRealtime) {
          supabase.removeChannel(canalRealtime);
          canalRealtime = null;
        }
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function atualizarConexao(ok) {
        elConexao.classList.toggle("erro", !ok);
        elConexaoLabel.textContent = ok ? "ao vivo" : "reconectando";
      }

      function aplicarListaClinicas(clinicas) {
        clinicasCache = clinicas || [];
        aplicarBusca();
      }

      // Lista + conversa aberta agora vêm direto do Supabase (anon key + sessão do
      // usuário) - a RLS decide o que cada papel enxerga, não filtramos aqui.
      function refrescarLista() {
        if (listaEmVoo) return;
        listaEmVoo = true;
        supabase
          .from("conversas")
          .select("telefone,clinica,role,mensagem,criado_em")
          .order("criado_em", { ascending: false })
          .limit(2000)
          .then(function (res) {
            listaEmVoo = false;
            if (res.error) {
              atualizarConexao(false);
              return;
            }
            var porClinica = new Map();
            (res.data || []).forEach(function (row) {
              var chave = (row.clinica || "") + "|" + row.telefone;
              if (!porClinica.has(chave)) porClinica.set(chave, row);
            });
            var clinicas = Array.from(porClinica.values()).map(function (row) {
              return {
                clinica: row.clinica || "(sem nome)",
                telefone: row.telefone,
                ultima_mensagem: row.mensagem,
                ultimo_role: row.role,
                criado_em: row.criado_em,
              };
            });
            aplicarListaClinicas(clinicas);
            atualizarConexao(true);
          });
      }

      function refrescarConversa() {
        if (!atual || !ultimoCriadoEm) return;
        if (conversaEmVoo) return;
        conversaEmVoo = true;
        supabase
          .from("conversas")
          .select("id,telefone,clinica,role,mensagem,criado_em")
          .eq("telefone", atual.telefone)
          .gt("criado_em", ultimoCriadoEm)
          .order("criado_em", { ascending: true })
          .limit(200)
          .then(function (res) {
            conversaEmVoo = false;
            if (res.error) {
              atualizarConexao(false);
              return;
            }
            atualizarConexao(true);
            var mensagens = res.data || [];
            if (!mensagens.length) return;
            mensagens.forEach(function (m) {
              adicionarMensagem(m);
              ultimoCriadoEm = m.criado_em;
            });
            elMsgs.scrollTop = elMsgs.scrollHeight;
          });
      }

      function tick() {
        refrescarLista();
        refrescarConversa();
      }

      function iniciarRealtime() {
        pararPoll();
        canalRealtime = supabase
          .channel("conversas-realtime")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "conversas" },
            function (payload) {
              var nova = payload.new;
              // Atualizar lista
              refrescarLista();
              // Se a conversa aberta recebeu mensagem nova, atualizar
              if (
                atual &&
                nova.telefone === atual.telefone &&
                nova.clinica === atual.clinica
              ) {
                refrescarConversa();
              }
            },
          )
          .subscribe(function (status) {
            atualizarConexao(status === "SUBSCRIBED");
          });
      }

      function atualizarBtnPausar() {
        var btn = document.getElementById("btn-pausar-ia");
        if (!atual) { btn.style.display = "none"; return; }
        btn.style.display = "";
        btn.textContent = iaPausada ? "Retomar IA" : "Pausar IA";
        btn.classList.toggle("pausada", iaPausada);
      }

      function abrirConversa(item) {
        atual = { telefone: item.telefone, clinica: item.clinica };
        ultimaChaveDia = null;
        iaPausada = false;
        elApp.classList.add("conversa-aberta");
        elHead.style.display = "flex";
        elConversaTel.textContent = formatarTelefone(item.telefone);
        elConversaClinica.textContent = item.clinica;
        elMsgs.innerHTML = "";
        atualizarBtnPausar();
        var carregando = document.createElement("div");
        carregando.className = "placeholder";
        carregando.textContent = "Carregando…";
        elMsgs.appendChild(carregando);

        Array.prototype.forEach.call(
          elLista.querySelectorAll(".paciente-item"),
          function (el) {
            el.classList.toggle(
              "ativo",
              el.dataset.chave === item.clinica + "|" + item.telefone,
            );
          },
        );

        supabase
          .from("conversas")
          .select("id,telefone,clinica,role,mensagem,criado_em")
          .eq("telefone", item.telefone)
          .order("criado_em", { ascending: false })
          .limit(1000)
          .then(function (res) {
            elMsgs.innerHTML = "";
            ultimaChaveDia = null;
            if (res.error) {
              var erro = document.createElement("div");
              erro.className = "placeholder";
              erro.textContent = "Falha ao carregar conversa.";
              elMsgs.appendChild(erro);
              return;
            }
            var mensagens = (res.data || []).slice().reverse();
            if (!mensagens.length) {
              var vazio = document.createElement("div");
              vazio.className = "placeholder";
              vazio.textContent = "Sem mensagens ainda.";
              elMsgs.appendChild(vazio);
              ultimoCriadoEm = new Date().toISOString();
            } else {
              mensagens.forEach(function (m) {
                adicionarMensagem(m);
              });
              ultimoCriadoEm = mensagens[mensagens.length - 1].criado_em;
              elMsgs.scrollTop = elMsgs.scrollHeight;
            }
          });
      }

      function agruparPorClinica(lista) {
        var ordem = [];
        var mapa = {};
        lista.forEach(function (item) {
          var nome = item.clinica;
          if (!mapa[nome]) {
            mapa[nome] = [];
            ordem.push(nome);
          }
          mapa[nome].push(item);
        });
        return ordem.map(function (nome) {
          return { clinica: nome, pacientes: mapa[nome] };
        });
      }

      function criarItemPaciente(c) {
        var btn = document.createElement("button");
        btn.className = "paciente-item";
        btn.type = "button";
        btn.dataset.chave = c.clinica + "|" + c.telefone;
        if (
          atual &&
          atual.clinica === c.clinica &&
          atual.telefone === c.telefone
        ) {
          btn.classList.add("ativo");
        }

        var linha1 = document.createElement("div");
        linha1.className = "linha1";
        var tel = document.createElement("div");
        tel.className = "tel";
        tel.textContent = formatarTelefone(c.telefone);
        var rel = document.createElement("div");
        rel.className = "rel";
        rel.textContent = tempoRelativo(c.criado_em);
        linha1.appendChild(tel);
        linha1.appendChild(rel);

        var prev = document.createElement("div");
        prev.className = "prev";
        prev.textContent = previewTexto(c);

        btn.appendChild(linha1);
        btn.appendChild(prev);
        btn.addEventListener("click", function () {
          abrirConversa(c);
        });
        return btn;
      }

      function criarGrupoClinica(grupo) {
        var wrap = document.createElement("div");
        wrap.className = "grupo-clinica";

        var colapsado = !!colapsados[grupo.clinica];

        var header = document.createElement("button");
        header.type = "button";
        header.className = "grupo-header" + (colapsado ? " colapsado" : "");

        var nome = document.createElement("span");
        nome.className = "nome";
        nome.textContent = grupo.clinica;

        var contagem = document.createElement("span");
        contagem.className = "contagem";
        contagem.textContent = grupo.pacientes.length;

        var seta = document.createElement("span");
        seta.className = "seta";
        seta.textContent = "▾";

        header.appendChild(nome);
        header.appendChild(contagem);
        header.appendChild(seta);

        var pacientesWrap = document.createElement("div");
        pacientesWrap.className =
          "grupo-pacientes" + (colapsado ? " colapsado" : "");
        grupo.pacientes.forEach(function (c) {
          pacientesWrap.appendChild(criarItemPaciente(c));
        });

        header.addEventListener("click", function () {
          var novoColapsado = !colapsados[grupo.clinica];
          colapsados[grupo.clinica] = novoColapsado;
          header.classList.toggle("colapsado", novoColapsado);
          pacientesWrap.classList.toggle("colapsado", novoColapsado);
        });

        wrap.appendChild(header);
        wrap.appendChild(pacientesWrap);
        return wrap;
      }

      // admin ve a coluna de clinicas (agrupado); clinica entra direto na propria
      // lista de pacientes, sem selecao (a RLS ja garante que so tem 1 clinica ali).
      function renderLista(clinicas, semResultado) {
        var scrollAnterior = elLista.scrollTop;
        elLista.innerHTML = "";
        if (!clinicas.length) {
          var vazio = document.createElement("div");
          vazio.className = "vazio";
          vazio.textContent = semResultado
            ? "Nenhum resultado pra essa busca."
            : "Nenhuma conversa ainda.";
          elLista.appendChild(vazio);
          return;
        }
        if (meuPapel === "clinica") {
          clinicas.forEach(function (c) {
            elLista.appendChild(criarItemPaciente(c));
          });
        } else {
          agruparPorClinica(clinicas).forEach(function (grupo) {
            elLista.appendChild(criarGrupoClinica(grupo));
          });
        }
        elLista.scrollTop = scrollAnterior;
      }

      function aplicarBusca() {
        var termo = elBusca.value.trim().toLowerCase();
        if (!termo) {
          renderLista(clinicasCache, false);
          return;
        }
        var filtradas = clinicasCache.filter(function (c) {
          return (
            c.clinica.toLowerCase().indexOf(termo) !== -1 ||
            c.telefone.toLowerCase().indexOf(termo) !== -1 ||
            formatarTelefone(c.telefone).toLowerCase().indexOf(termo) !== -1
          );
        });
        renderLista(filtradas, true);
      }

      function mostrarGate(msg) {
        pararPoll();
        atual = null;
        meuPapel = null;
        elApp.classList.remove("show");
        elApp.classList.remove("conversa-aberta");
        elGate.style.display = "flex";
        elLoginErro.textContent = msg || "";
      }
      function mostrarApp() {
        elGate.style.display = "none";
        elApp.classList.add("show");
      }

      // Busca o perfil (papel + clinica_id) pra saber se mostra a coluna de clinicas
      // (admin) ou entra direto na conversa da propria clinica.
      function carregarPerfilEIniciar(usuario) {
        supabase
          .from("perfis")
          .select("papel,clinica_id,nome")
          .eq("id", usuario.id)
          .maybeSingle()
          .then(function (res) {
            if (res.error || !res.data) {
              supabase.auth.signOut();
              mostrarGate("Usuário sem perfil configurado. Contate o suporte.");
              return;
            }
            meuPapel = res.data.papel;
            elTopbarSub.textContent =
              meuPapel === "admin" ? "Administrador" : res.data.nome || "";
            mostrarApp();
            refrescarLista();
            atualizarConexao(true);
            iniciarRealtime();
          });
      }

      elBusca.addEventListener("input", aplicarBusca);

      document
        .getElementById("form-login")
        .addEventListener("submit", function (ev) {
          ev.preventDefault();
          elLoginErro.textContent = "";
          if (!supabase) {
            elLoginErro.textContent = "Carregando, aguarde e tenta de novo.";
            return;
          }
          var email = document.getElementById("email").value;
          var senha = document.getElementById("senha").value;
          supabase.auth
            .signInWithPassword({ email: email, password: senha })
            .then(function (res) {
              if (res.error || !res.data.session) {
                elLoginErro.textContent = "E-mail ou senha incorretos.";
                return;
              }
              document.getElementById("senha").value = "";
              carregarPerfilEIniciar(res.data.session.user);
            });
        });

      document
        .getElementById("btn-logout")
        .addEventListener("click", function () {
          pararPoll();
          supabase.auth.signOut().then(function () {
            mostrarGate();
          });
        });

      // Exportar CSV
      document
        .getElementById("btn-exportar")
        .addEventListener("click", function () {
          var btn = this;
          btn.disabled = true;
          btn.textContent = "⏳";
          fetch("/api/clinica/painel-acoes?acao=exportar")
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, corpo: j };
              });
            })
            .then(function (res) {
              btn.disabled = false;
              btn.textContent = "📥 CSV";
              if (!res.ok || !res.corpo.csv) {
                alert("Nenhuma conversa para exportar.");
                return;
              }
              // Download do CSV
              var blob = new Blob([res.corpo.csv], {
                type: "text/csv;charset=utf-8;",
              });
              var url = URL.createObjectURL(blob);
              var a = document.createElement("a");
              a.href = url;
              a.download = "conversas-recepta-" + new Date().toISOString().slice(0, 10) + ".csv";
              a.click();
              URL.revokeObjectURL(url);
            })
            .catch(function () {
              btn.disabled = false;
              btn.textContent = "📥 CSV";
              alert("Falha ao exportar. Tente novamente.");
            });
        });

      document
        .getElementById("btn-voltar")
        .addEventListener("click", function () {
          atual = null;
          elApp.classList.remove("conversa-aberta");
        });

      document
        .getElementById("btn-pausar-ia")
        .addEventListener("click", function () {
          if (!atual) return;
          var btn = this;
          btn.disabled = true;
          var acao = iaPausada ? "retomar_conversa" : "pausar_conversa";
          fetch("/api/clinica/painel-acoes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              acao: acao,
              telefone: atual.telefone,
              clinica: atual.clinica,
            }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, corpo: j };
              });
            })
            .then(function (res) {
              btn.disabled = false;
              if (!res.ok) return;
              iaPausada = !iaPausada;
              atualizarBtnPausar();
            })
            .catch(function () {
              btn.disabled = false;
            });
        });

      // Aba volta ao foco: refresca dados mesmo se Realtime perdeu algo.
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          refrescarLista();
          if (atual) refrescarConversa();
        }
      });

      // Boot: pega url/anon key (via rota que so devolve config publica, nunca
      // service_role) e reidrata sessao existente do Supabase Auth, se houver.
      fetch("/api/painel/config", { cache: "no-store" })
        .then(function (r) {
          return r.json();
        })
        .then(function (cfg) {
          supabase = createClient(cfg.url, cfg.anonKey);

          supabase.auth.onAuthStateChange(function (event) {
            if (event === "SIGNED_OUT") mostrarGate();
          });

          return supabase.auth.getSession();
        })
        .then(function (res) {
          var sessao = res && res.data && res.data.session;
          if (!sessao) {
            mostrarGate();
            return;
          }
          carregarPerfilEIniciar(sessao.user);
        });
    </script>
    </main>
    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script src="/smooth-scroll.js"></script>
  </body>
