<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Página não encontrada | Recepta AI</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/img/favicon-512.png"
    />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <style>
      :root {
        --header-bg: #151749;
        --accent: #26205c;
        --accent-ink: #ffffff;
        --accent-soft: #f3f2f5;
        --accent-2: #afa8eb;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(
            1100px 900px at 25% 30%,
            rgba(168, 148, 255, 0.55),
            rgba(168, 148, 235, 0.22) 40%,
            transparent 68%
          ),
          var(--header-bg);
        color: #fff;
        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-weight: 400;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      a {
        color: inherit;
      }
      .container {
        max-width: 1080px;
        margin: 0 auto;
        width: 100%;
        padding-inline: 20px;
      }

      /* topo com logo, mesmo padrao do header da landing */
      .top {
        padding: 20px 0;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
      }
      .logo svg {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: block;
      }
      .logo span {
        color: var(--accent-2);
      }
      .logo:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      /* bloco central */
      main {
        flex: 1;
        display: flex;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      .error-block {
        max-width: 640px;
        padding: 24px 0 64px;
      }
      .error-code {
        font-weight: 800;
        font-size: clamp(96px, 22vw, 220px);
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--accent-2);
        opacity: 0.4;
        margin-bottom: 8px;
      }
      .error-block h1 {
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .error-block .lede {
        font-size: 17px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 32px;
        max-width: 46ch;
      }
      .error-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
      }

      /* botoes, mesmo padrao da landing */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 11px;
        padding: 14px 22px;
        font-weight: 600;
        font-size: 15.5px;
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          transform 0.12s,
          filter 0.12s,
          box-shadow 0.12s;
      }
      .btn-primary {
        background: #fff;
        color: var(--accent);
        box-shadow: 0 1px 2px rgba(16, 13, 34, 0.08);
      }
      .btn-primary:hover {
        background: var(--accent-soft);
        filter: none;
        box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.4);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .link-secondary {
        font-size: 14.5px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.75);
        text-decoration: underline;
        text-underline-offset: 3px;
        border-radius: 4px;
      }
      .link-secondary:hover {
        color: #fff;
      }
      .link-secondary:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      /* motion: reveal sutil, mesmo padrao da landing */
      .js .reveal {
        opacity: 0;
        transform: translateY(10px);
        filter: blur(4px);
      }
      .reveal {
        transition:
          opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal,
        .js .reveal {
          transition: none !important;
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      }

      @media (max-width: 480px) {
        .logo svg {
          width: 30px;
          height: 30px;
        }
        .logo {
          font-size: 17px;
          gap: 7px;
        }
        .error-actions {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }
      }
    </style>
    <link rel="stylesheet" href="/page-transition.css" />
    <link rel="stylesheet" href="/loading-screen.css" />
    <script src="/page-transition.js"></script>
  </head>
  <body>
    <div class="top container">
      <a class="logo" href="/">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="translate(0 50)">
            <path
              d="M 34 -34 C -1.7 -15.9, -1.7 15.9, 34 34 C 69.7 15.9, 69.7 -15.9, 34 -34 Z"
              fill="currentColor"
              fill-opacity="0.6"
            />
            <path
              d="M 66 -34 C 30.3 -15.9, 30.3 15.9, 66 34 C 101.7 15.9, 101.7 -15.9, 66 -34 Z"
              fill="currentColor"
            />
          </g>
        </svg>
        Recepta <span>AI</span>
      </a>
    </div>

    <main class="container">
      <div class="error-block reveal">
        <p class="error-code" aria-hidden="true">404</p>
        <h1>Essa página não existe</h1>
        <p class="lede">
          O link pode ter mudado de lugar. Volte pro início ou fale com a gente.
        </p>
        <div class="error-actions">
          <a class="btn btn-primary" href="/">
            Voltar pro início
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </a>
          <a class="link-secondary" href="/#faq">Falar com a gente</a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var alvos = document.querySelectorAll(".reveal");
        var semMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (semMotion || !("IntersectionObserver" in window)) {
          alvos.forEach(function (el) {
            el.classList.add("is-visible");
          });
          return;
        }
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12 },
        );
        alvos.forEach(function (el) {
          observer.observe(el);
        });
      })();
    </script>
    <script src="/vendor/lenis-1.3.26.min.js"></script>
    <script src="/smooth-scroll.js"></script>
  </body>
</html>
