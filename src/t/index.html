<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Status do teste — Recepta AI</title>
    <meta name="description" content="Status do seu teste da Recepta AI." />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/img/favicon-512.png"
    />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0d0f12;
        --card: #14171c;
        --card2: #191d23;
        --line: #262b33;
        --txt: #eceef1;
        --mut: #8d95a1;
        --acc: #4ade9b;
        --acc2: #2dd4bf;
        --err: #f87171;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--txt);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            900px 500px at 15% -10%,
            rgba(45, 212, 191, 0.1),
            transparent 60%
          ),
          radial-gradient(
            700px 400px at 90% 0%,
            rgba(74, 222, 155, 0.07),
            transparent 60%
          );
        pointer-events: none;
        z-index: 0;
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 520px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 28px;
        text-align: center;
      }
      .ic {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(74, 222, 155, 0.14);
        border: 1px solid rgba(74, 222, 155, 0.35);
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        font-size: 28px;
      }
      .ic.warn {
        background: rgba(248, 113, 113, 0.12);
        border-color: rgba(248, 113, 113, 0.35);
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-bottom: 12px;
      }
      p {
        color: var(--mut);
        max-width: 42ch;
        margin: 0 auto;
      }
      .steps {
        text-align: left;
        margin-top: 26px;
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }
      .step {
        display: flex;
        gap: 12px;
        margin-bottom: 14px;
      }
      .step:last-child {
        margin-bottom: 0;
      }
      .sn {
        flex: 0 0 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--card2);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font-size: 11.5px;
        color: var(--acc);
        font-weight: 600;
      }
      .sn.on {
        background: rgba(74, 222, 155, 0.14);
        border-color: rgba(74, 222, 155, 0.35);
      }
      .st {
        font-size: 13.5px;
        color: var(--txt);
      }
      .st b {
        display: block;
        margin-bottom: 2px;
      }
      .token {
        margin-top: 24px;
        font-size: 11.5px;
        color: #5c6470;
        letter-spacing: 0.03em;
      }
      .token code {
        color: var(--mut);
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 7px;
      }
      .back {
        display: inline-block;
        margin-top: 20px;
        font-size: 13.5px;
        color: var(--acc2);
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="/page-transition.css" />
    <link rel="stylesheet" href="/loading-screen.css" />
    <script src="/page-transition.js"></script>
  </head>
  <body>
    <main>
    <div class="wrap">
      <div class="card" id="card">
        <div class="ic">…</div>
        <h1>Carregando</h1>
        <p>Buscando o status do seu teste.</p>
      </div>
    </div>
    <script>
      const token = location.pathname.split("/")[2] || "";
      const card = document.getElementById("card");
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      function renderInvalid() {
        card.innerHTML =
          '<div class="ic warn">!</div>' +
          "<h1>Link inválido ou expirado</h1>" +
          "<p>Não encontramos nenhum teste com esse link. Confira se copiou o endereço completo ou entre em contato com a gente.</p>" +
          '<a class="back" href="/">← Voltar para a página inicial</a>';
      }

      function renderError() {
        card.innerHTML =
          '<div class="ic warn">!</div>' +
          "<h1>Não conseguimos carregar agora</h1>" +
          "<p>Pode ser instabilidade temporária. Tenta atualizar a página em instantes.</p>" +
          '<a class="back" href="' +
          location.pathname +
          '">Tentar de novo</a>';
      }

      function renderBriefingRecebido(data) {
        const clinica = data.clinica ? esc(data.clinica) : "sua clínica";
        card.innerHTML =
          '<div class="ic">✓</div>' +
          "<h1>Briefing recebido</h1>" +
          "<p>Recebemos o briefing de " +
          clinica +
          ". Estamos configurando sua Recepta AI.</p>" +
          '<div class="steps">' +
          '<div class="step"><div class="sn on">1</div><div class="st"><b>Briefing enviado</b>Recebemos as informações da sua clínica.</div></div>' +
          '<div class="step"><div class="sn">2</div><div class="st"><b>Conectar o WhatsApp</b>Vamos te chamar pra ligar o número ao atendimento.</div></div>' +
          '<div class="step"><div class="sn">3</div><div class="st"><b>Recepta no ar</b>Sua secretária virtual começa a atender.</div></div>' +
          "</div>" +
          '<p class="token">Referência: <code>' +
          esc(data.token) +
          "</code></p>";
      }

      function renderOutroStatus(data) {
        card.innerHTML =
          '<div class="ic">…</div>' +
          "<h1>Sua Recepta está em preparação</h1>" +
          "<p>Ainda estamos ajustando essa etapa. Assim que tiver novidade, ela aparece aqui.</p>" +
          '<p class="token">Referência: <code>' +
          esc(data.token) +
          "</code></p>";
      }

      async function load() {
        if (!token) {
          renderInvalid();
          return;
        }
        try {
          const r = await fetch("/api/trial/" + encodeURIComponent(token));
          if (r.status === 404) {
            renderInvalid();
            return;
          }
          if (!r.ok) {
            renderError();
            return;
          }
          const data = await r.json();
          if (data.status === "briefing_recebido") renderBriefingRecebido(data);
          else renderOutroStatus(data);
        } catch (e) {
          renderError();
        }
      }
      load();
    </script>
    </main>
    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script src="/smooth-scroll.js"></script>
  </body>
</html>
