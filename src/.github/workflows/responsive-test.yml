name: Responsive Test

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.html'
      - 'src/**/*.css'
      - 'src/**/*.js'
  pull_request:
    branches: [master]
    paths:
      - 'src/**/*.html'
      - 'src/**/*.css'
      - 'src/**/*.js'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test'
        required: false
        default: 'https://www.receptaai.com.br'
      max_overflow:
        description: 'Max overflow issues per page'
        required: false
        default: '0'
      max_touch_small:
        description: 'Max touch target issues per page'
        required: false
        default: '10'

jobs:
  responsive-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: src
        run: |
          npm ci
          npx playwright install chromium
          
      - name: Run responsive tests
        working-directory: src
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://www.receptaai.com.br' }}
        run: |
          node test-responsive-ci.mjs \
            --max-overflow ${{ github.event.inputs.max_overflow || '0' }} \
            --max-touch-small ${{ github.event.inputs.max_touch_small || '10' }} \
            --max-total 50 \
            --max-critical 0 \
            --output-dir screenshots/ci
          
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-screenshots
          path: src/screenshots/ci/
          retention-days: 30
          
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-report
          path: src/screenshots/ci/report.json
          retention-days: 30
          
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'src/screenshots/ci/report.json';
            
            if (!fs.existsSync(reportPath)) {
              return;
            }
            
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const { summary, thresholds } = report;
            
            const status = summary.criticalIssues <= thresholds.maxCritical && summary.totalIssues <= thresholds.maxTotal;
            const emoji = status ? '✅' : '❌';
            
            let body = `## ${emoji} Responsive Test Results\n\n`;
            body += `| Metric | Value | Threshold |\n`;
            body += `|--------|-------|-----------|\n`;
            body += `| Total Tests | ${summary.total} | - |\n`;
            body += `| Passed | ${summary.passed} | - |\n`;
            body += `| Failed | ${summary.failed} | - |\n`;
            body += `| Total Issues | ${summary.totalIssues} | ${thresholds.maxTotal} |\n`;
            body += `| Critical Issues | ${summary.criticalIssues} | ${thresholds.maxCritical} |\n\n`;
            
            if (!status) {
              body += `### Failed Pages\n\n`;
              for (const result of report.results.filter(r => !r.passed)) {
                body += `- **${result.page}** (${result.viewport}): ${result.overflow} overflow, ${result.touchTargets} touch targets\n`;
              }
            }
            
            body += `\n<sub>Generated by Responsive Test workflow • ${report.timestamp}</sub>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
