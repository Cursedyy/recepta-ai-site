<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login da clínica · Recepta AI</title>
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/img/favicon-512.png"
    />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f8f7ff;
        --surface: #ffffff;
        --ink: #26205c;
        --muted: #696580;
        --line: #dedbf5;
        --accent: #26205c;
        --accent-ink: #ffffff;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      button,
      input {
        font: inherit;
      }
      form {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 32px 28px;
        max-width: 340px;
        width: 100%;
        box-shadow: 0 20px 50px -30px rgba(20, 30, 27, 0.35);
      }
      h1 {
        font-size: 19px;
        margin-bottom: 6px;
      }
      p.sub {
        color: var(--muted);
        font-size: 13.5px;
        margin-bottom: 18px;
      }
      input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 12px;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        position: relative;
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition:
          filter 0.15s,
          opacity 0.15s;
        overflow: hidden;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }

      /* loading spinner (21st.dev pattern) */
      .btn-loading .btn-text {
        opacity: 0;
        transform: translateY(6px);
      }
      .btn-loading::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;
        border: 2.5px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: loginSpinner 0.7s linear infinite;
      }
      .btn-text {
        display: inline-block;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      @keyframes loginSpinner {
        to {
          transform: rotate(360deg);
        }
      }

      /* error / attempt messages
         Use #login-erro (specificity 1,0,0) to always beat auth.css .erro (0,1,0) */
      #login-erro {
        display: block;
        color: #b3261e;
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 18px;
        line-height: 1.4;
        transition: opacity 0.2s;
      }
      #login-erro:empty {
        min-height: 0;
        margin-bottom: 0;
      }
      #login-erro .attempt-count {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: #8b1a1a;
        opacity: 0.85;
      }
      #login-erro.erro-blocked,
      #login-erro > .erro-blocked {
        color: #8b1a1a;
        background: #fdeaea;
        border: 1px solid #f5c6c6;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 10px;
        line-height: 1.4;
      }
      #login-erro .erro-blocked .blocked-timer {
        display: block;
        margin-top: 6px;
        font-weight: 600;
        font-size: 14px;
        color: #b3261e;
      }
    </style>
    <link rel="stylesheet" href="/clinica/auth.css" />
    <link rel="stylesheet" href="/page-transition.css" />
    <link rel="stylesheet" href="/loading-screen.css" />
    <script src="/page-transition.js"></script>
  </head>
  <body>
    <main class="auth-shell">
      <aside class="auth-aside" aria-label="Recepta AI">
        <a class="auth-wordmark" href="/">
          <span class="auth-mark" aria-hidden="true">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <g transform="translate(0 50)">
                <path
                  d="M 34 -34 C -1.7 -15.9, -1.7 15.9, 34 34 C 69.7 15.9, 69.7 -15.9, 34 -34 Z"
                  fill="currentColor"
                  fill-opacity="0.6"
                />
                <path
                  d="M 66 -34 C 30.3 -15.9, 30.3 15.9, 66 34 C 101.7 15.9, 101.7 -15.9, 66 -34 Z"
                  fill="currentColor"
                />
              </g>
            </svg>
          </span>
          Recepta <b>AI</b>
        </a>
        <div class="auth-pitch">
          <span class="auth-kicker">Painel da clínica</span>
          <h2>Seu atendimento continua, mesmo quando você pausa.</h2>
          <p>Acompanhe a operação da sua secretária virtual em um só lugar.</p>
        </div>
        <span class="auth-trust">Acesso protegido para sua clínica</span>
      </aside>
      <section class="auth-content">
        <div class="auth-form-wrap">
          <a class="auth-wordmark auth-mobile-brand" href="/">
            <span class="auth-mark" aria-hidden="true">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <g transform="translate(0 50)">
                  <path
                    d="M 34 -34 C -1.7 -15.9, -1.7 15.9, 34 34 C 69.7 15.9, 69.7 -15.9, 34 -34 Z"
                    fill="currentColor"
                    fill-opacity="0.6"
                  />
                  <path
                    d="M 66 -34 C 30.3 -15.9, 30.3 15.9, 66 34 C 101.7 15.9, 101.7 -15.9, 66 -34 Z"
                    fill="currentColor"
                  />
                </g>
              </svg>
            </span>
            Recepta <b>AI</b>
          </a>
          <form id="form-login" novalidate>
            <h1>Painel da clínica</h1>
            <p class="sub">Entre com o e-mail e senha da sua clínica.</p>
            <div class="erro" id="login-erro"></div>
            <input
              type="email"
              id="email"
              placeholder="E-mail"
              autocomplete="username"
              required
            />
            <input
              type="password"
              id="senha"
              placeholder="Senha"
              autocomplete="current-password"
              required
            />
            <button type="submit" id="btn-entrar">
              <span class="btn-text">Entrar</span>
            </button>
            <a
              href="/clinica/esqueci-senha"
              style="
                display: block;
                text-align: center;
                margin-top: 14px;
                font-size: 13px;
                color: var(--muted);
              "
              >Esqueci minha senha</a
            >
          </form>
        </div>
      </section>
    </main>
    <script>
      var elForm = document.getElementById("form-login");
      var elErro = document.getElementById("login-erro");
      var elBtn = document.getElementById("btn-entrar");
      var elBtnText = elBtn.querySelector(".btn-text");

      function setLoading(on) {
        if (on) {
          elBtn.classList.add("btn-loading");
          elBtn.disabled = true;
        } else {
          elBtn.classList.remove("btn-loading");
          elBtn.disabled = false;
          elBtnText.textContent = "Entrar";
        }
      }

      // Segundos que faltam ate o fim da janela do rate limit. A API manda
      // bloqueado_ate (ISO); os 300s so valem se ela nao mandar. Sem o clamp,
      // um relogio local adiantado libera o botao antes da hora, e um atrasado
      // deixa o usuario esperando uma janela que ja acabou.
      function segundosDeBloqueio(corpo) {
        var ate = corpo && corpo.bloqueado_ate;
        if (!ate) return 300;
        var faltam = Math.ceil((new Date(ate).getTime() - Date.now()) / 1000);
        if (!isFinite(faltam)) return 300;
        return Math.max(1, Math.min(faltam, 3600));
      }

      function setBlocked(seconds) {
        elBtn.classList.remove("btn-loading");
        elBtn.disabled = true;
        elBtnText.textContent = "Bloqueado";
        var elTimer = elErro.querySelector(".blocked-timer");
        var remaining = seconds;
        function tick() {
          if (remaining <= 0) {
            setLoading(false);
            elErro.innerHTML = "";
            return;
          }
          var m = Math.floor(remaining / 60);
          var s = remaining % 60;
          var time = m > 0 ? m + "min " + s + "s" : s + "s";
          elBtnText.textContent = "Aguarde " + time;
          if (elTimer) elTimer.textContent = time;
          remaining--;
          setTimeout(tick, 1000);
        }
        tick();
      }

      function showError(msg, attempts) {
        var html = msg;
        if (typeof attempts === "number" && attempts >= 0) {
          html +=
            '<span class="attempt-count">Tentativas restantes: ' +
            attempts +
            "/5</span>";
        }
        elErro.innerHTML = html;
        /* Forca visibilidade via inline style para garantir que qualquer
           conflito CSS (ex: auth.css .erro) nao esconda a mensagem. */
        elErro.style.cssText =
          "display:block;visibility:visible;opacity:1;color:#b3261e;font-size:13px;margin-bottom:10px;line-height:1.4;min-height:18px;";
      }

      elForm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        elErro.innerHTML = "";
        elErro.style.cssText = "";

        var email = document.getElementById("email").value.trim();
        var senha = document.getElementById("senha").value;

        if (!email || !senha) {
          elErro.textContent = "Preenche e-mail e senha.";
          elErro.style.cssText =
            "display:block;visibility:visible;opacity:1;color:#b3261e;font-size:13px;margin-bottom:10px;line-height:1.4;min-height:18px;";
          return;
        }

        setLoading(true);
        elBtnText.textContent = "Entrando\u2026";

        fetch("/api/clinica/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, senha: senha }),
        })
          .then(function (r) {
            return r.json().then(function (j) {
              return { ok: r.ok, corpo: j };
            });
          })
          .then(function (res) {
            if (res.corpo && res.corpo.erro === "muitas_tentativas") {
              var msg =
                res.corpo.mensagem ||
                "Muitas tentativas. Conta bloqueada temporariamente.";
              elErro.innerHTML =
                '<div class="erro-blocked">' +
                msg +
                '<span class="blocked-timer"></span></div>';
              setBlocked(segundosDeBloqueio(res.corpo));
              return;
            }
            if (!res.ok) {
              var restantes =
                res.corpo && typeof res.corpo.restantes === "number"
                  ? res.corpo.restantes
                  : null;
              if (restantes !== null && restantes <= 0) {
                elErro.innerHTML =
                  '<div class="erro-blocked">E-mail ou senha incorretos.<span class="blocked-timer"></span></div>';
                setBlocked(segundosDeBloqueio(res.corpo));
                return;
              }
              setLoading(false);
              showError("E-mail ou senha incorretos.", restantes);
              return;
            }
            window.location.href = "/clinica/painel";
          })
          .catch(function () {
            setLoading(false);
            showError("Falha de conexão. Tenta de novo.");
          });
      });
    </script>
    <script src="/vendor/lenis-1.3.26.min.js"></script>
    <script src="/smooth-scroll.js"></script>
  </body>
</html>
